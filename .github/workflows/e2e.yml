name: Enhanced engine and VS Code integration

# Validate the independently maintained source and the exact engine/TeX pair in
# the installer. No checkout, release lookup or download of an upstream engine.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact repository ref to test before publishing a release
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  bundled-mac:
    name: Apple Silicon bundled runtime and source build
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Require the supported native architecture
        run: node -e "require('node:assert/strict').equal(process.platform + '-' + process.arch, 'darwin-arm64')"

      - name: Install extension dependencies
        run: npm ci

      - name: Verify the preserved engine and matching TeX support
        run: npm run verify:engine

      - name: Install Rust for the preserved source build
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/engine

      - name: Build the checked-in enhanced engine with locked dependencies
        run: |
          npm run build:engine
          expected="$(node -p "require('./vendor/engine/SOURCE.json').enhancedVersion")"
          actual="$(vendor/engine/target/dist/rtex --version)"
          test "$actual" = "rtex $expected"
          # Different Rust toolchains can produce different machine-code bytes.
          # Keep the tested installer binary unchanged and verify it separately.
          npm run verify:engine

      - name: Engine Rust unit tests
        run: cargo test --manifest-path vendor/engine/Cargo.toml --workspace --lib --locked

      - name: Cache TeX Live
        uses: actions/cache@v4
        with:
          path: vendor/engine/build/texlive
          key: enhanced-texlive-2026-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/engine/scripts/install-texlive.sh', 'vendor/engine/scripts/texlive.profile') }}

      - name: Prepare TeX Live from the preserved installer script
        # The installer is idempotent: a complete cache uses only local packages.
        # Network installation is limited to TeX Live dependencies from CTAN.
        run: bash vendor/engine/scripts/install-texlive.sh

      - name: Configure TeX and keep runtime selection automatic
        run: |
          source vendor/engine/build/texlive.env
          echo "$RTEX_TEXLIVE_BIN" >> "$GITHUB_PATH"
          {
            echo "RTEX_TEXLIVE_BIN=$RTEX_TEXLIVE_BIN"
            echo "RTEX_TEST_TEXLIVE_BIN=$RTEX_TEXLIVE_BIN"
            echo "RTEX_E2E_TEXLIVE_BIN=$RTEX_TEXLIVE_BIN"
            echo "TEXMFVAR=$TEXMFVAR"
            echo "TEXMFCONFIG=$TEXMFCONFIG"
            echo "TEXMFHOME=$TEXMFHOME"
          } >> "$GITHUB_ENV"
          lualatex --version

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and real bundled-engine regressions
        env:
          RTEX_TEST_BUNDLED: '1'
        run: npm test

      - name: Package and extract the production installer
        run: |
          installer="$RUNNER_TEMP/realtime-tex-enhanced-candidate.vsix"
          unpacked="$RUNNER_TEMP/realtime-tex-enhanced-candidate"
          npm run package -- --out "$installer"
          mkdir -p "$unpacked"
          unzip -q "$installer" -d "$unpacked"
          echo "RTEX_E2E_EXTENSION_PATH=$unpacked/extension" >> "$GITHUB_ENV"

      - name: Production installer integration from fresh VS Code storage
        env:
          # The preserved engine reports a preamble-stopped body-only pass as Ok;
          # the first-compile failure case is still exercised by the E2E suite.
          RTEX_E2E_SKIP_FAILED_PASS: '1'
        run: npm run test:e2e

      - name: Preserve the exact tested installer
        uses: actions/upload-artifact@v4
        with:
          name: tested-enhanced-vsix
          path: ${{ runner.temp }}/realtime-tex-enhanced-candidate.vsix
          if-no-files-found: error
